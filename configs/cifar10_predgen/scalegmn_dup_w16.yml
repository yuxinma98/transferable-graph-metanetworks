# ScaleGMN accuracy prediction on the small CNN zoo, trained at the zoo's native
# width w16 — Stage 2 (duplicated-CNN sanity check).
#
# Same model and optimization as scalegmn_predgen_sp.yml; the only differences are
# that the data comes through OUR reader (src/data/cnn_zoo_dataset.CNNZooDataset, from
# the exported .pth state dicts in w16_zoo_dup/) so that a checkpoint is saved, and
# that the readout is one of the width-agnostic ones from src/models/.
#
# The test list holds w16 only: the widened widths (w32-w128) are scored once from the
# best checkpoint by scripts/eval_sizegen_predgen_duplicated.py, not every epoch. At
# w128 a graph has ~36k edges, so the eval batch size scales down to 1 and a per-epoch
# sweep over all widths would dominate training time.
#
# Run (baseline / dup-equiv are the same config plus a flag):
#   python scripts/train_sizegen_predgen.py --conf configs/cifar10_predgen/scalegmn_dup_w16.yml --wandb True
#   python scripts/train_sizegen_predgen.py --conf configs/cifar10_predgen/scalegmn_dup_w16.yml \
#       --duplication-equiv True --wandb True

batch_size: 64
num_workers: 4

data:
  dataset: cnn_zoo
  activation_function: relu
  node_pos_embed: &node_pos_embed True
  # see scalegmn_predgen_sp.yml: get_edge_types() disagrees with cnn_to_tg_data's
  # edge order once the output layer has more than one node
  edge_pos_embed: &edge_pos_embed False
  max_kernel_size: [3, 3]

  train_layer_layouts: [[1, 16, 16, 16, 10]]
  train_dataset_paths: [$ANYDIM_DATA_ROOT/cnn_zoo/w16_zoo_dup]
  train_split_paths: [$ANYDIM_DATA_ROOT/cnn_zoo/w16_zoo_dup/cnn_zoo_dup_splits.json]

  test_layer_layouts: [[1, 16, 16, 16, 10]]
  test_dataset_paths: [$ANYDIM_DATA_ROOT/cnn_zoo/w16_zoo_dup]
  test_split_paths: [$ANYDIM_DATA_ROOT/cnn_zoo/w16_zoo_dup/cnn_zoo_dup_splits.json]

train_args:
  num_epochs: 200
  seed: 0
  loss: MSE

scalegmn_args:
  d_in_v: &d_in_v 1
  d_in_e: &d_in_e 1  # overwritten to _max_kernel_height * _max_kernel_width = 9
  d_hid: &d_hid 128
  num_layers: 4
  direction: forward   # every CNN condition of this study is forward, matching the
                       # FMNIST size-gen v2 arm; bidirectional was deliberately not run
  equivariant: False
  symmetry: scale
  jit: False
  compile: False

  readout_range: last_layer   # overridden to full_graph; our readout installs there
  gnn_skip_connections: False

  concat_mlp_directions: False
  reciprocal: True

  node_pos_embed: *node_pos_embed
  edge_pos_embed: *edge_pos_embed

  _max_kernel_height: 3
  _max_kernel_width: 3

  graph_init:
    d_in_v: *d_in_v
    d_in_e: *d_in_e
    project_node_feats: True
    project_edge_feats: True
    d_node: *d_hid
    d_edge: *d_hid

  positional_encodings:
    final_linear_pos_embed: False
    sum_pos_enc: False
    po_as_different_linear: False
    equiv_net: False
    sum_on_io: True
    equiv_on_hidden: True
    num_mlps: 3
    layer_equiv_on_hidden: False

  gnn_args:
    d_hid: *d_hid
    message_fn_layers: 1
    message_fn_skip_connections: False
    update_node_feats_fn_layers: 1
    update_node_feats_fn_skip_connections: False
    update_edge_attr: True
    dropout: 0.
    dropout_all: False
    update_as_act: False
    update_as_act_arg: sum
    mlp_on_io: True
    msg_equiv_on_hidden: True
    upd_equiv_on_hidden: True
    layer_msg_equiv_on_hidden: False
    layer_upd_equiv_on_hidden: False
    msg_num_mlps: 2
    upd_num_mlps: 2
    pos_embed_msg: False
    pos_embed_upd: False
    layer_norm: False
    aggregator: add          # --duplication-equiv True switches this to mean
    sign_symmetrization: True

  mlp_args:
    d_k: [ *d_hid ]
    activation: silu
    dropout: 0.
    final_activation: identity
    batch_norm: False
    layer_norm: True
    bias: True
    skip: False

  readout_args:
    d_out: 1
    d_rho: *d_hid

optimization:
  clip_grad: True
  clip_grad_max_norm: 10.0
  optimizer_name: AdamW
  optimizer_args:
    lr: 1e-3
    weight_decay: 0.01
  scheduler_args:
    scheduler: WarmupLRScheduler
    warmup_steps: 1000
    scheduler_mode: min
    decay_rate: 0
    decay_steps: 0
    patience: None
    min_lr: None

wandb_args:
  project: cifar10_predgen
  entity: null
  group: predgen-dup
  name: predgen-dup-sgmn-base
  tags: [predgen, dup, scale, relu, w16]

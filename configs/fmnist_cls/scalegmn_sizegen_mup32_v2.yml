# ScaleGMN config for Fashion-MNIST size generalization v2: train w32, test w32-w256.
# Train + per-width eval. Non-overlapping images per width (fmnist_sizegen_splits_v2.json):
# 56k train / 1k val at w32, 1k disjoint test images at every width.
# muP ReLU INRs with base_width=32 = the training width, so w32 muP is identical to w32 SP
# and the two data conditions differ only at the OOD widths.
#
# Run via: python scripts/train_sizegen.py --conf configs/fmnist_cls/scalegmn_sizegen_mup32_v2.yml --wandb True

batch_size: 64
num_workers: 4

data:
  dataset: labeled_mnist_inr
  # Training width: w32 only (all 70k images fitted at this width)
  train_layer_layouts:
    - [2, 32, 32, 1]
  train_dataset_paths:
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w32_mup32
  train_split_paths:
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w32_mup32/fmnist_sizegen_splits_v2.json
  # Test widths (w32 is in-distribution; 1k disjoint images per width)
  test_layer_layouts:
    - [2, 32, 32, 1]
    - [2, 48, 48, 1]
    - [2, 64, 64, 1]
    - [2, 80, 80, 1]
    - [2, 96, 96, 1]
    - [2, 128, 128, 1]
    - [2, 192, 192, 1]
    - [2, 256, 256, 1]
  test_dataset_paths:
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w32_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w48_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w64_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w80_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w96_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w128_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w192_mup32
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w256_mup32
  test_split_paths:
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w32_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w48_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w64_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w80_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w96_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w128_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w192_mup32/fmnist_sizegen_splits_v2.json
    - $ANYDIM_DATA_ROOT/fmnist_inrs/w256_mup32/fmnist_sizegen_splits_v2.json
  image_size: [28, 28]
  node_pos_embed: &node_pos_embed True
  edge_pos_embed: &edge_pos_embed True

train_args:
  num_epochs: 200
  val_acc_threshold: 0.1
  patience: 50
  seed: 0
  loss: CrossEntropyLoss

scalegmn_args:
  d_in_v: &d_in_v 1
  d_in_e: &d_in_e 1
  d_hid: &d_hid 128
  num_layers: 4
  direction: forward
  equivariant: False
  symmetry: scale
  jit: False
  compile: False

  readout_range: full_graph
  gnn_skip_connections: True

  concat_mlp_directions: False
  reciprocal: True

  node_pos_embed: *node_pos_embed
  edge_pos_embed: *edge_pos_embed

  graph_init:
    d_in_v: *d_in_v
    d_in_e: *d_in_e
    project_node_feats: True
    project_edge_feats: True
    d_node: *d_hid
    d_edge: *d_hid

  positional_encodings:
    final_linear_pos_embed: False
    sum_pos_enc: False
    po_as_different_linear: False
    equiv_net: False
    sum_on_io: True
    equiv_on_hidden: True
    num_mlps: 3
    layer_equiv_on_hidden: False

  gnn_args:
    d_hid: *d_hid
    message_fn_layers: 1
    message_fn_skip_connections: False
    update_node_feats_fn_layers: 1
    update_node_feats_fn_skip_connections: False
    update_edge_attr: True
    dropout: 0.2
    dropout_all: False
    update_as_act: False
    update_as_act_arg: sum
    mlp_on_io: False
    msg_equiv_on_hidden: True
    upd_equiv_on_hidden: True
    layer_msg_equiv_on_hidden: False
    layer_upd_equiv_on_hidden: False
    msg_num_mlps: 2
    upd_num_mlps: 2
    pos_embed_msg: False
    pos_embed_upd: False
    layer_norm: False
    aggregator: add
    sign_symmetrization: True

  mlp_args:
    d_k: [ *d_hid ]
    activation: silu
    dropout: 0.
    final_activation: identity
    batch_norm: False
    layer_norm: True
    bias: True
    skip: False

  readout_args:
    d_out: 10
    d_rho: *d_hid

optimization:
  clip_grad: True
  clip_grad_max_norm: 10.0
  optimizer_name: AdamW
  optimizer_args:
    lr: 2.5e-4
  scheduler_args:
    scheduler: WarmupLRScheduler
    warmup_steps: 1000
    scheduler_mode: min
    decay_rate: 0
    decay_steps: 0
    patience: None
    min_lr: None

wandb_args:
  project: fmnist_cls
  entity: null
  group: sizegen-v2-mup32
  name: scalegmn-sizegen-v2-mup32-train32
  tags: [sizegen-v2, train-w32, test-large, scale, mup32, non-overlapping, fmnist]
